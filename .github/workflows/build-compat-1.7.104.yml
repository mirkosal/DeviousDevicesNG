name: Build Skyrim 1.7.104 compatibility DLL

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-compat-1.7.104.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "include/**"
      - "src/**"
      - "cmake/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure and build
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
          configurePreset: build-release-msvc
          configurePresetAdditionalArgs: "['-DCMAKE_TOOLCHAIN_FILE:STRING=C:/vcpkg/scripts/buildsystems/vcpkg.cmake']"
          buildPreset: release-msvc

      - name: Collect Vortex-ready DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/SKSE/Plugins | Out-Null
          Copy-Item build/release-msvc/DeviousDevices.dll artifact/SKSE/Plugins/DeviousDevices.dll

      - name: Upload Vortex-ready test artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDNG-Skyrim-1.7.104-Test
          path: artifact
          if-no-files-found: error
          retention-days: 30
